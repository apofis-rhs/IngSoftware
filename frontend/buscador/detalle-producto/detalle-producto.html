<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIKA — Detalle Producto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/buscador/detalle-producto/detalle-producto.css">
</head>
<body>

  <nav class="navbar">
    <a class="navbar__logo" href="/inicio/inicio.html">
      <img class="navbar__logo-img" src="/assets/img/logo.png" alt="LUMIKA">
      <span class="navbar__logo-text">LUMIKA</span>
    </a>
    <div class="navbar__links hide-mobile">
      <a href="/inicio/inicio.html" class="navbar__link"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="/perfil/mi-perfil/mi-perfil.html" class="navbar__link"><i class="fa-regular fa-user"></i> Perfil</a>
      <a href="/buscador/inicio/inicio.html" class="navbar__link navbar__link--active"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
      <a href="/recomendaciones/inicio/inicio.html" class="navbar__link"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
      <a href="/perfil/favoritos/favoritos.html" class="navbar__link"><i class="fa-regular fa-star"></i> Mis Favoritos</a>
      <a href="#" id="btn-cerrar-sesion" class="navbar__link navbar__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
    </div>
    <button class="navbar__hamburger hide-desktop" id="hamburger" aria-label="Menú">
      <span></span><span></span>
    </button>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-house"></i> Inicio</a>
    <a href="/perfil/mi-perfil/mi-perfil.html" class="nav-drawer__link"><i class="fa-regular fa-user"></i> Perfil</a>
    <a href="/buscador/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
    <a href="/recomendaciones/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
    <a href="/perfil/favoritos/favoritos.html" class="nav-drawer__link"><i class="fa-regular fa-star"></i> Mis Favoritos</a>
    <div class="nav-drawer__divider"></div>
    <a href="#" id="btn-cerrar-sesion-mobile" class="nav-drawer__link nav-drawer__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
  </div>

  <main class="page-wrapper">

    <!-- Loader -->
    <div id="loader" class="text-center" style="padding:var(--space-8)">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--color-text-muted)"></i>
      <p class="text-muted" style="margin-top:var(--space-3)">Cargando producto...</p>
    </div>

    <!-- Contenido principal -->
    <div id="contenido-producto" class="hidden">

      <!-- Imagen + semáforo -->
      <div class="detalle-hero">
        <div class="detalle-hero__img-wrap">
          <img id="imagen-producto" src="/assets/images/placeholder.svg" alt="Producto"
               class="detalle-hero__img">
        </div>
        <div class="detalle-hero__semaforo">
          <div class="semaforo-dot" id="semaforo-dot"
               style="width:56px;height:56px;border-radius:50%;margin:0 auto var(--space-2)"></div>
          <p id="estado-evaluacion" class="text-bold text-center" style="font-size:var(--text-md)"></p>
        </div>
      </div>

      <!-- Nombre + precio -->
      <div style="margin-bottom:var(--space-4)">
        <h1 id="nombre-producto" class="text-h1" style="margin-bottom:var(--space-1)"></h1>
        <p id="precio" class="text-bold" style="font-size:var(--text-lg);color:var(--color-text-secondary)"></p>
      </div>

      <!-- Botones acción -->
      <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-6)">
        <button class="btn btn--secondary" id="btn-favorito" style="flex:1">
          <i class="fa-regular fa-star"></i> Guardar
        </button>
        <button class="btn btn--primary" id="btn-alternativas" style="flex:1">
          <i class="fa-solid fa-arrows-left-right"></i> Ver alternativas
        </button>
      </div>

      <!-- Descripción (razón de clasificación) -->
      <div class="card fade-in-up" style="margin-bottom:var(--space-4)" id="card-descripcion">
        <h3 class="text-h3" style="margin-bottom:var(--space-2)">
          <i class="fa-solid fa-circle-info" style="color:var(--color-primary-dark);margin-right:6px"></i>
          Descripción
        </h3>
        <p id="explicacion-semaforo" style="font-size:var(--text-base);line-height:1.7;color:var(--color-text-secondary)"></p>
      </div>

      <!-- Ingredientes desde BD -->
      <div class="card fade-in-up anim-delay-1" style="margin-bottom:var(--space-4)" id="card-ingredientes">
        <h3 class="text-h3" style="margin-bottom:var(--space-2)">
          <i class="fa-solid fa-flask" style="color:var(--color-success);margin-right:6px"></i>
          Ingredientes
        </h3>
        <div id="lista-ingredientes"></div>
      </div>

      <!-- Criterios ambientales (si los tiene) -->
      <div class="card fade-in-up anim-delay-2" style="margin-bottom:var(--space-4)" id="card-criterios">
        <h3 class="text-h3" style="margin-bottom:var(--space-2)">
          <i class="fa-solid fa-leaf" style="color:var(--color-success);margin-right:6px"></i>
          Criterios ambientales
        </h3>
        <div id="lista-criterios"></div>
      </div>

      <!-- Ventajas -->
      <div class="card fade-in-up anim-delay-3" style="margin-bottom:var(--space-4)" id="card-ventajas">
        <h3 class="text-h3" style="margin-bottom:var(--space-2);color:var(--color-success)">
          <i class="fa-solid fa-thumbs-up" style="margin-right:6px"></i>
          Ventajas
        </h3>
        <div id="lista-ventajas"></div>
      </div>

      <!-- Desventajas -->
      <div class="card fade-in-up anim-delay-4" style="margin-bottom:var(--space-8)" id="card-desventajas">
        <h3 class="text-h3" style="margin-bottom:var(--space-2);color:var(--color-error)">
          <i class="fa-solid fa-thumbs-down" style="margin-right:6px"></i>
          Desventajas
        </h3>
        <div id="lista-desventajas"></div>
      </div>

      <button class="btn-regresar" id="btn-regresar">Regresar</button>
    </div>

  </main>

  <script type="module" src="/buscador/detalle-producto/detalle-producto.js"></script>
</body>
</html>
