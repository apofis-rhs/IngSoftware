<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIKA — Detalle Producto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/buscador/detalle-producto/detalle-producto.css">
</head>
<body>

  <nav class="navbar">
    <a class="navbar__logo" href="/inicio/inicio.html">
      <img class="navbar__logo-img" src="/assets/img/logo.png" alt="LUMIKA">
      <span class="navbar__logo-text">LUMIKA</span>
    </a>
    <div class="navbar__links hide-mobile">
      <a href="/inicio/inicio.html" class="navbar__link"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="/perfil/mi-perfil/mi-perfil.html" class="navbar__link"><i class="fa-regular fa-user"></i> Perfil</a>
      <a href="/buscador/inicio/inicio.html" class="navbar__link navbar__link--active"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
      <a href="/recomendaciones/inicio/inicio.html" class="navbar__link"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
      <a href="/perfil/favoritos/favoritos.html" class="navbar__link"><i class="fa-regular fa-star"></i> Mis Favoritos</a>
      <a href="#" id="btn-cerrar-sesion" class="navbar__link navbar__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
    </div>
    <button class="navbar__hamburger hide-desktop" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-house"></i> Inicio</a>
    <a href="/perfil/mi-perfil/mi-perfil.html" class="nav-drawer__link"><i class="fa-regular fa-user"></i> Perfil</a>
    <a href="/buscador/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
    <a href="/recomendaciones/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
    <a href="/perfil/favoritos/favoritos.html" class="nav-drawer__link"><i class="fa-regular fa-star"></i> Mis Favoritos</a>
    <div class="nav-drawer__divider"></div>
    <a href="#" id="btn-cerrar-sesion-mobile" class="nav-drawer__link nav-drawer__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
  </div>

  <main class="page-wrapper">

    <div id="loader" class="text-center" style="padding:var(--space-8)">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--color-text-muted)"></i>
      <p class="text-muted" style="margin-top:var(--space-3)">Cargando producto...</p>
    </div>

    <div id="contenido-producto" class="hidden">

      <div class="producto-hero-card">
        
        <div class="producto-hero__imagen-container">
          <div class="semaforo-halo" id="semaforo-dot"></div>
          <img id="imagen-producto" src="/assets/images/placeholder.svg" alt="Producto" class="producto-hero__img">
        </div>

        <div class="producto-hero__info">
          <p id="estado-evaluacion" class="producto-hero__etiqueta"></p>
          <h1 id="nombre-producto" class="producto-hero__titulo"></h1>
          <p id="precio" class="producto-hero__precio"></p>

          <div class="producto-hero__acciones">
            <button class="btn-pill-secundario" id="btn-favorito" title="Guardar Favorito">
              <i class="fa-regular fa-star"></i>
            </button>
            <button class="btn-pill btn-pill--primary" id="btn-alternativas">
              <i class="fa-solid fa-arrows-left-right"></i> Ver alternativas ecológicas
            </button>
          </div>
        </div>

      </div>

      <div class="info-card info-card--full fade-in-up" id="card-descripcion">
        <h3 class="info-card__titulo">
          <i class="fa-solid fa-circle-info info-card__icono"></i>
          Razón de la clasificación
        </h3>
        <p id="explicacion-semaforo" class="info-card__texto"></p>
      </div>

      <!-- GRID INTELIGENTE (Se adapta automáticamente) -->
      <div class="grid-tarjetas-dinamico">
        
        <!-- Ventajas ecológicas -->
        <div class="info-card info-card--ventajas fade-in-up anim-delay-1" id="card-ventajas">
          <h3 class="info-card__titulo text-verde">
            <i class="fa-solid fa-leaf info-card__icono"></i> Ventajas Ecológicas
          </h3>
          <div id="lista-ventajas" class="info-card__lista"></div>
        </div>

        <!-- Desventajas -->
        <div class="info-card info-card--desventajas fade-in-up anim-delay-2" id="card-desventajas">
          <h3 class="info-card__titulo text-rojo">
            <i class="fa-solid fa-triangle-exclamation info-card__icono"></i> Desventajas
          </h3>
          <div id="lista-desventajas" class="info-card__lista"></div>
        </div>

        <!-- Ingredientes -->
        <div class="info-card fade-in-up anim-delay-3" id="card-ingredientes">
          <h3 class="info-card__titulo">
            <i class="fa-solid fa-flask info-card__icono text-verde"></i> Componentes
          </h3>
          <div id="lista-ingredientes" class="info-card__lista"></div>
        </div>

        <!-- Características (NUEVA TARJETA) -->
        <div class="info-card fade-in-up anim-delay-4" id="card-caracteristicas">
          <h3 class="info-card__titulo">
            <i class="fa-solid fa-list info-card__icono text-verde"></i> Características
          </h3>
          <div id="lista-caracteristicas" class="info-card__lista"></div>
        </div>


      </div>

      <button id="btn-regresar" class="btn-regresar">
        <i class="fa-solid fa-arrow-left"></i> Regresar
      </button>

    </div>

  </main>

  <script type="module" src="/buscador/detalle-producto/detalle-producto.js"></script>
</body>
</html>
