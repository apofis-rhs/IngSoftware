<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIKA — Detalle del Artículo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/recomendaciones/detalle-articulo/detalle-articulo.css">
</head>
<body>

  <nav class="navbar">
    <a href="/buscador/inicio/inicio.html" class="navbar__logo">
      <img class="navbar__logo-img" src="/assets/img/logo.png" alt="LUMIKA">
      <span class="navbar__logo-text">LUMIKA</span>
    </a>
    <div class="navbar__links hide-mobile">
      <a href="/perfil/mi-perfil/mi-perfil.html" class="navbar__link"><i class="fa-regular fa-user"></i> Perfil</a>
      <a href="/buscador/inicio/inicio.html" class="navbar__link"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
      <a href="/recomendaciones/inicio/inicio.html" class="navbar__link navbar__link--active"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
      <a href="/perfil/favoritos/favoritos.html" class="navbar__link"><i class="fa-regular fa-star"></i> Favoritos</a>
      <a href="#" id="btn-cerrar-sesion" class="navbar__link navbar__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
    </div>
    <button class="navbar__hamburger hide-desktop" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="/perfil/mi-perfil/mi-perfil.html" class="nav-drawer__link"><i class="fa-regular fa-user"></i> Perfil</a>
    <a href="/buscador/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-magnifying-glass"></i> Búsqueda</a>
    <a href="/recomendaciones/inicio/inicio.html" class="nav-drawer__link"><i class="fa-solid fa-leaf"></i> Recomendaciones</a>
    <a href="/perfil/favoritos/favoritos.html" class="nav-drawer__link"><i class="fa-regular fa-star"></i> Favoritos</a>
    <div class="nav-drawer__divider"></div>
    <a href="#" id="btn-cerrar-sesion-mobile" class="nav-drawer__link nav-drawer__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
  </div>

  <main class="page-wrapper detalle-page">

    <!-- Loader -->
    <div id="loader" style="text-align:center;padding:var(--space-8)">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--color-text-muted)"></i>
      <p class="text-muted" style="margin-top:var(--space-3)">Cargando artículo...</p>
    </div>

    <!-- Contenido dinámico -->
    <div id="contenido-articulo" class="hidden">

      <header class="detalle-header">
        <button class="detalle-header__back" id="btn-volver-resultados" aria-label="Volver">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="detalle-header__title" id="nombre-articulo">Cargando...</h1>
        <button class="detalle-header__fav" id="btn-favorito" aria-label="Favorito">
          <i class="fa-regular fa-star"></i>
        </button>
      </header>

      <!-- Icono decorativo -->
      <div style="text-align:center;margin:var(--space-6) 0">
        <div style="width:90px;height:90px;background:var(--color-success);border-radius:50%;
                    display:flex;align-items:center;justify-content:center;margin:0 auto">
          <i class="fa-solid fa-leaf" style="font-size:2.5rem;color:#fff"></i>
        </div>
      </div>

      <!-- Impacto ambiental -->
      <div class="card" style="margin-bottom:var(--space-4)">
        <h3 class="text-h3" style="margin-bottom:var(--space-2)">
          <i class="fa-solid fa-earth-americas" style="color:var(--color-success);margin-right:6px"></i>
          Impacto ambiental
        </h3>
        <p id="impacto-ambiental" style="font-size:var(--text-base);line-height:1.7;color:var(--color-text-secondary)"></p>
      </div>

      <!-- Alternativas sustentables -->
      <div class="card" style="margin-bottom:var(--space-4)" id="card-alternativas">
        <h3 class="text-h3" style="margin-bottom:var(--space-3)">
          <i class="fa-solid fa-recycle" style="color:var(--color-success);margin-right:6px"></i>
          Alternativas sustentables
        </h3>
        <div id="lista-alternativas">
          <p class="text-muted">Cargando alternativas...</p>
        </div>
      </div>

      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-4)">
        <button class="btn btn--primary" id="btn-ver-alternativas" style="flex:1">
          <i class="fa-solid fa-arrows-left-right"></i> Ver alternativas
        </button>
      </div>

      <button class="btn-regresar" id="btn-regresar" style="margin-top:var(--space-4)">Regresar</button>
    </div>

  </main>

  <script type="module" src="/recomendaciones/detalle-articulo/detalle-articulo.js"></script>
</body>
</html>
