<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIKA — Gestión de Productos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/admin/gestionar-productos/gestionar-productos.css">
  </head>
<body>

  <nav class="navbar" style="background-color: var(--color-bg-navbar)">
    <a class="navbar__logo" href="/admin/dashboard/dashboard.html">
      <img class="navbar__logo-img" src="/assets/img/logo.png" alt="LUMIKA">
      <span class="navbar__logo-text">LUMIKA</span>
      <span class="navbar__badge" style="background: var(--color-secondary-dark); color: white; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-left: 8px;">Admin</span>
    </a>
    <div class="navbar__links hide-mobile">
      <a href="/admin/dashboard/dashboard.html" class="navbar__link"><i class="fa-solid fa-chart-pie"></i> Panel</a>
      <a href="/admin/agregar-producto/agregar-producto.html" class="navbar__link"><i class="fa-solid fa-plus"></i> Agregar</a>
      <a href="/admin/gestionar-productos/gestionar-productos.html" class="navbar__link navbar__link--active"><i class="fa-solid fa-boxes-stacked"></i> Gestionar</a>
      <a href="#" id="btn-cerrar-sesion" class="navbar__link navbar__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
    </div>
    <button class="navbar__hamburger hide-desktop" id="hamburger" aria-label="Menú">
      <span></span><span></span>
    </button>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="/admin/dashboard/dashboard.html" class="nav-drawer__link"><i class="fa-solid fa-chart-pie"></i> Panel</a>
    <a href="/admin/agregar-producto/agregar-producto.html" class="nav-drawer__link"><i class="fa-solid fa-plus"></i> Agregar</a>
    <a href="/admin/gestionar-productos/gestionar-productos.html" class="nav-drawer__link nav-drawer__link--active"><i class="fa-solid fa-boxes-stacked"></i> Gestionar</a>
    <div class="nav-drawer__divider"></div>
    <a href="#" id="btn-cerrar-sesion-mobile" class="nav-drawer__link nav-drawer__link--danger"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
  </div>

  <main class="page-wrapper" style="padding-top: 0;">

    <header class="admin-compact-banner">
      <i class="fa-solid fa-arrow-left btn-back-icon" onclick="window.location.href='/admin/dashboard/dashboard.html'" title="Regresar al panel"></i>
      <h2>Gestión de <span id="tipo-actual">Productos</span></h2>
    </header>

    <div class="admin-controls-wrapper">
      <div class="gestionar-tabs">
        <button class="gestionar-tab active" id="tab-productos" onclick="cambiarTab('productos')">
          <i class="fa-solid fa-box"></i> Productos
        </button>
        <button class="gestionar-tab" id="tab-articulos" onclick="cambiarTab('articulos')">
          <i class="fa-solid fa-leaf"></i> Artículos
        </button>
      </div>

      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="admin-search-input" id="input-buscar" placeholder="Busca por nombre o etiqueta...">
      </div>

      <div class="price-filter-container" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <span style="font-size:var(--text-sm); color:var(--color-text-muted); font-weight:bold;">
          <i class="fa-solid fa-tag"></i> Precio:
        </span>
        <input type="number" id="input-precio-min" class="admin-search-input" placeholder="Mín. $" min="0" step="0.01" style="width:110px;">
        <span style="color:var(--color-text-muted);">—</span>
        <input type="number" id="input-precio-max" class="admin-search-input" placeholder="Máx. $" min="0" step="0.01" style="width:110px;">
        <button id="btn-limpiar-filtros" class="btn btn--secondary" type="button" style="border-radius:20px; padding:6px 14px; font-size:var(--text-sm);" title="Limpiar todos los filtros">
          <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar
        </button>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: var(--space-4);">
      <span id="total-items" style="background: rgba(0,0,0,0.05); padding: 6px 15px; border-radius: 20px; font-size: var(--text-sm); font-weight: bold; color: var(--color-text-secondary);"></span>
    </div>

    <div id="loader" style="text-align:center; padding:var(--space-8); color:var(--color-text-muted)">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color: var(--color-primary)"></i>
      <p style="margin-top:var(--space-2); font-weight: bold;">Cargando catálogo...</p>
    </div>

    <div class="admin-product-list hidden" id="lista-items"></div>

    <a href="/admin/agregar-producto/agregar-producto.html" class="btn-fab-add" title="Agregar nuevo">
      <i class="fa-solid fa-plus"></i>
    </a>

  </main>

  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <div style="width: 70px; height: 70px; background: rgba(226, 0, 116, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4);">
        <i class="fa-solid fa-trash-can" style="font-size:2rem; color:var(--color-secondary-dark);"></i>
      </div>
      <h3 style="font-size: 1.3rem; margin-bottom: 5px;">¿Eliminar elemento?</h3>
      <p id="modal-nombre-item" style="color:var(--color-primary-dark); font-weight: bold; font-size: 1.1rem; margin-bottom: 10px;"></p>
      <p style="color:var(--color-text-muted); font-size:var(--text-sm); margin-bottom:var(--space-6)">Esta acción es permanente y no se puede deshacer.</p>
      <div style="display: flex; gap: 15px; justify-content: center;">
        <button class="btn btn--secondary" id="btn-cancelar-eliminar" style="flex: 1; border-radius: 20px;">Cancelar</button>
        <button class="btn btn--primary" id="btn-confirmar-eliminar" style="flex: 1; border-radius: 20px; background: var(--color-secondary-dark); color: white;">Eliminar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/admin/gestionar-productos/gestionar-productos.js"></script>
</body>
</html>
